# Free Render web service + external Supabase PostgreSQL storage.
services:
  - type: web
    name: fusion-2048
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
